<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volleyball Quick Tagger</title>
    <link rel="stylesheet" href="style.css?v=20260527-16">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Serve and attack analysis</p>
        <h1>Volleyball Quick Tagger</h1>
      </div>
    </header>

    <main class="app-shell">
      <section class="panel settings-panel" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle" class="sr-only">設定</h2>
        <p id="saveStatus" class="sr-only" aria-live="polite">準備完了</p>

        <div class="settings-grid">
          <label>
            YouTube URL または動画ID
            <input id="youtubeInput" type="text" placeholder="https://youtu.be/XXXXXXXXXXX" autocomplete="off">
          </label>
          <label>
            動画タイトル
            <input id="projectNameInput" type="text" placeholder="動画読み込み後に自動取得" autocomplete="off" readonly>
          </label>
          <label>
            チームA名称
            <input id="teamANameInput" type="text" autocomplete="off">
          </label>
          <div class="color-field">
            <span class="field-label">チームAカラー</span>
            <div class="color-presets" aria-label="チームAカラー">
              <button type="button" class="color-swatch" data-team-color="A" data-color="#ffffff" style="--swatch-color: #ffffff" aria-label="チームA 白"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#1f2623" style="--swatch-color: #1f2623" aria-label="チームA 黒"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#145fa8" style="--swatch-color: #145fa8" aria-label="チームA 青"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#9c3b1c" style="--swatch-color: #9c3b1c" aria-label="チームA 赤"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#176f5d" style="--swatch-color: #176f5d" aria-label="チームA 緑"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#f1c84b" style="--swatch-color: #f1c84b" aria-label="チームA 黄"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#6f4aa8" style="--swatch-color: #6f4aa8" aria-label="チームA 紫"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#e986aa" style="--swatch-color: #e986aa" aria-label="チームA 桃"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#68c7df" style="--swatch-color: #68c7df" aria-label="チームA 水色"></button>
              <button type="button" class="color-swatch" data-team-color="A" data-color="#f28c28" style="--swatch-color: #f28c28" aria-label="チームA オレンジ"></button>
            </div>
          </div>
          <label>
            チームB名称
            <input id="teamBNameInput" type="text" autocomplete="off">
          </label>
          <div class="color-field">
            <span class="field-label">チームBカラー</span>
            <div class="color-presets" aria-label="チームBカラー">
              <button type="button" class="color-swatch" data-team-color="B" data-color="#ffffff" style="--swatch-color: #ffffff" aria-label="チームB 白"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#1f2623" style="--swatch-color: #1f2623" aria-label="チームB 黒"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#145fa8" style="--swatch-color: #145fa8" aria-label="チームB 青"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#9c3b1c" style="--swatch-color: #9c3b1c" aria-label="チームB 赤"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#176f5d" style="--swatch-color: #176f5d" aria-label="チームB 緑"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#f1c84b" style="--swatch-color: #f1c84b" aria-label="チームB 黄"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#6f4aa8" style="--swatch-color: #6f4aa8" aria-label="チームB 紫"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#e986aa" style="--swatch-color: #e986aa" aria-label="チームB 桃"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#68c7df" style="--swatch-color: #68c7df" aria-label="チームB 水色"></button>
              <button type="button" class="color-swatch" data-team-color="B" data-color="#f28c28" style="--swatch-color: #f28c28" aria-label="チームB オレンジ"></button>
            </div>
          </div>
        </div>

        <div class="button-row settings-actions">
          <button id="loadVideoButton" type="button">動画読み込み</button>
          <label class="file-button">
            ファイル読み込み
            <input id="importProjectInput" type="file" accept="application/json,.json">
          </label>
          <button id="exportProjectButton" type="button" class="export-button">ファイル書き出し</button>
          <button id="resetProjectButton" type="button" class="reset-button">初期化</button>
        </div>

        <details class="drive-sync-panel">
          <summary>
            <span class="drive-summary-title">自動保存</span>
            <span id="driveSummaryStatus" class="drive-summary-status">未設定</span>
          </summary>
          <div class="drive-sync-grid">
            <label class="drive-sync-toggle">
              <input id="driveAutoSaveEnabled" type="checkbox">
              Drive自動保存を有効にする
            </label>
            <label>
              Apps Script WebアプリURL
              <input id="driveWebAppUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
            </label>
            <label>
              保存先フォルダID
              <input id="driveFolderIdInput" type="text" placeholder="Google DriveフォルダID" autocomplete="off">
            </label>
            <label>
              保存キー
              <input id="driveSecretInput" type="password" autocomplete="off">
            </label>
          </div>
        </details>
      </section>

      <section class="main-grid">
        <div class="left-column">
          <section class="panel player-panel" aria-labelledby="playerTitle">
            <div class="section-heading">
              <h2 id="playerTitle">動画</h2>
              <p><span id="videoIdLabel">動画未読み込み</span></p>
            </div>
            <div class="player-frame" aria-label="YouTube動画プレイヤー">
              <div id="player"></div>
            </div>
            <div class="playback-controls" aria-label="再生操作">
              <button id="seekBack30Button" type="button" class="skip-button">-30s</button>
              <button id="seekBack5Button" type="button" class="skip-button">-5s</button>
              <button id="seekBack1Button" type="button" class="skip-button">-1s</button>
              <button id="playPauseButton" type="button" class="play-pause-button" aria-label="再生 / 一時停止">
                <span class="play-icon" aria-hidden="true"></span>
                <span class="pause-icon" aria-hidden="true"></span>
              </button>
              <button id="seekForward1Button" type="button" class="skip-button">+1s</button>
              <button id="seekForward5Button" type="button" class="skip-button">+5s</button>
              <button id="seekForward30Button" type="button" class="skip-button">+30s</button>
            </div>
          </section>

          <section class="panel tagging-panel" aria-labelledby="taggingTitle">
            <div class="section-heading">
              <h2 id="taggingTitle">クイックタグ</h2>
              <p>現在時刻: <strong id="currentTimeLabel">0:00.0</strong></p>
            </div>

            <div class="tag-actions tag-actions-grid">
              <button id="tagTopLeftButton" type="button" class="serve-button" data-position="topLeft" data-team="B" data-play="serve">
                <span>サーブ</span>
                <span id="tagTopLeftTeamLabel">B</span>
              </button>
              <button id="tagTopRightButton" type="button" class="spike-button" data-position="topRight" data-team="B" data-play="attack">
                <span>アタック</span>
                <span id="tagTopRightTeamLabel">B</span>
              </button>
              <button id="courtChangeButton" type="button" class="court-change-button">コートチェンジ</button>
              <button id="tagBottomLeftButton" type="button" class="serve-button" data-position="bottomLeft" data-team="A" data-play="serve">
                <span>サーブ</span>
                <span id="tagBottomLeftTeamLabel">A</span>
              </button>
              <button id="tagBottomRightButton" type="button" class="spike-button" data-position="bottomRight" data-team="A" data-play="attack">
                <span>アタック</span>
                <span id="tagBottomRightTeamLabel">A</span>
              </button>
            </div>
          </section>
        </div>

        <div class="right-column">
          <section class="panel table-panel" aria-labelledby="tableTitle">
            <div class="section-heading">
              <h2 id="tableTitle">タグ一覧</h2>
              <p>合計 <span id="totalTagsLabel">0</span> 件</p>
            </div>
            <div id="tagTableScroll" class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th><button type="button" class="sort-button" data-sort-key="time">時刻</button></th>
                    <th><button type="button" class="sort-button" data-sort-key="team">チーム</button></th>
                    <th><button type="button" class="sort-button" data-sort-key="play">プレー</button></th>
                    <th><span class="sr-only">タグ操作</span></th>
                  </tr>
                </thead>
                <tbody id="tagTableBody"></tbody>
              </table>
            </div>
          </section>

          <section class="panel replay-panel" aria-labelledby="replayTitle">
            <div class="section-heading">
              <h2 id="replayTitle">絞り込み再生</h2>
              <p id="replaySummaryLabel">該当タグ 0 件</p>
            </div>

            <div class="filter-grid">
              <label>
                プレー種別
                <select id="playFilter">
                  <option value="">すべて</option>
                  <option value="serve">サーブ</option>
                  <option value="attack">アタック</option>
                </select>
              </label>
              <label>
                チーム
                <select id="teamFilter">
                  <option value="">すべて</option>
                  <option value="A">チームA</option>
                  <option value="B">チームB</option>
                </select>
              </label>
            </div>

            <div class="replay-window">
              <div id="replayRangeSlider" class="range-slider" aria-label="再生範囲">
                <div class="range-track"></div>
                <div id="replayRangeFill" class="range-fill"></div>
                <button id="beforeHandle" type="button" class="range-handle before-handle" aria-label="前の秒数"></button>
                <button id="afterHandle" type="button" class="range-handle after-handle" aria-label="後の秒数"></button>
              </div>
            </div>

            <div class="button-row replay-controls">
              <button id="playFilteredButton" type="button">連続再生</button>
              <button id="previousReplayButton" type="button" class="secondary-button">前のプレー</button>
              <button id="nextReplayButton" type="button" class="secondary-button">次のプレー</button>
              <button id="stopReplayButton" type="button" class="secondary-button">再生終了</button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <dialog id="resetConfirmDialog" class="confirm-dialog" aria-labelledby="resetConfirmTitle">
      <form method="dialog">
        <h2 id="resetConfirmTitle">初期化しますか？</h2>
        <p>現在の入力内容とローカル保存データを初期化します。ファイル書き出ししていないタグは失われます。</p>
        <div class="dialog-actions">
          <button id="resetCancelButton" type="submit" value="cancel" class="secondary-button" autofocus>キャンセル</button>
          <button type="submit" value="reset" class="reset-button">初期化する</button>
        </div>
      </form>
    </dialog>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js?v=20260527-5"></script>
  </body>
</html>
